[package]
name = "litechat"
version = "0.2.2"
edition = "2024"
description = "Lightweight desktop client for WhatsApp Web, built on WebView2"
license = "MIT"

[dependencies]
tao = "0.37.2"
tray-icon = "0.26.1"
webview2-com = "0.39"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_System_Registry", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "UI_Notifications", "Data_Xml_Dom", "Foundation"] }
windows-core = "0.62"
wry = "0.57.2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[build-dependencies]
winresource = "0.1.34"
