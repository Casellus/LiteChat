[package]
name = "litechat"
version = "0.1.0"
edition = "2024"
description = "Lightweight desktop client for WhatsApp Web, built on WebView2"
license = "MIT"

[dependencies]
tao = "0.37.2"
tray-icon = "0.26.1"
webview2-com = "0.39"
windows-core = "0.62"
wry = "0.57.2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[build-dependencies]
winresource = "0.1.34"
