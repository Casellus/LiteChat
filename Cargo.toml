[package]
name = "litechat"
version = "0.2.1"
edition = "2024"
description = "Lightweight desktop client for WhatsApp Web"
license = "MIT"

[dependencies]
tao = "0.37.2"
wry = "0.57.2"

[target.'cfg(target_os = "windows")'.dependencies]
tray-icon = "0.26.1"
webview2-com = "0.39"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_System_Registry", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "UI_Notifications", "Data_Xml_Dom", "Foundation"] }
windows-core = "0.62"

[target.'cfg(target_os = "linux")'.dependencies]
gio = "0.18"
glib = "0.18"
gtk = "0.18"
ksni = { version = "0.3", features = ["blocking"] }
webkit2gtk = { version = "2.0", features = ["v2_40"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[target.'cfg(target_os = "windows")'.build-dependencies]
winresource = "0.1.34"
